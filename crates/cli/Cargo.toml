[package]
name = "bluecompress-cli"
description = "Headless command line front end for Blue Compressor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bluecompress"
path = "src/main.rs"

[dependencies]
bluecompress = { path = "../core" }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Update check (one anonymous HTTPS GET to the GitHub releases API).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[features]
cuda = ["bluecompress/cuda"]
opencl = ["bluecompress/opencl"]
