[package]
name = "bluecompress"
description = "Re-encodes Nikon N-RAW (.NEV) and R3D NE (.R3D) TICO RAW clips"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["metal", "wgpu"]
metal = []
# Develop on the GPU through wgpu: Metal on a Mac, Vulkan or DX12 on Windows and Linux. Without
# a usable GPU the CPU path is used.
wgpu = ["dep:wgpu", "dep:pollster"]
# Untested NVIDIA backend (CUDA driver and NVRTC are loaded at run time; no toolkit needed to build).
cuda = ["dep:cudarc"]
# OpenCL backend for AMD (and other) GPUs. libOpenCL / OpenCL.dll is loaded at run time, so
# builds need no SDK and machines without a driver fall back to the CPU.
opencl = ["dep:opencl3"]

[dependencies]
rayon = "1"
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
pollster = { version = "1", optional = true }
opencl3 = { version = "0.12", optional = true, default-features = false, features = ["dynamic"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12060"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
