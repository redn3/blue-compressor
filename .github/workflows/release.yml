name: Release

# Push a tag like v0.1.0 (or run manually) to build installers and command line tools for
# macOS (Apple silicon and Intel), Windows and Linux and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0); it must already exist"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft \
            --title "Blue Compressor ${TAG#v}" --notes-file .github/release-notes.md

  build:
    needs: create-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write # build provenance attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-latest, target: aarch64-apple-darwin, arch: arm64, ffmpeg: "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, arch: x64, ffmpeg: "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip" }
          # Windows and Linux: static GPL ffmpeg 8.1 builds with NVENC, AMF, QSV (and VAAPI on
          # Linux) next to libx265, so Develop exports use the GPU encoder when there is one.
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, ffmpeg: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" }
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x64, ffmpeg: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: tauri-cli@2

      # The Develop export encoder on macOS: a static ffmpeg 9.0.2 (GPL, see NOTICE) bundled
      # in Contents/Resources, as in the test builds.
      - name: Fetch ffmpeg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/bin
          curl -fsSL -o /tmp/ffmpeg.zip "${{ matrix.ffmpeg }}"
          unzip -o -q /tmp/ffmpeg.zip -d /tmp/ffmpeg
          mv /tmp/ffmpeg/ffmpeg app/src-tauri/bin/ffmpeg
          chmod +x app/src-tauri/bin/ffmpeg
          app/src-tauri/bin/ffmpeg -hide_banner -encoders | grep -E "hevc_videotoolbox|libx265"

      - name: Fetch ffmpeg (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/bin /tmp/ffmpeg
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL -o /tmp/ffmpeg.zip "${{ matrix.ffmpeg }}"
            unzip -o -q /tmp/ffmpeg.zip -d /tmp/ffmpeg
            cp /tmp/ffmpeg/*/bin/ffmpeg.exe app/src-tauri/bin/ffmpeg.exe
            ff=app/src-tauri/bin/ffmpeg.exe
            want="hevc_nvenc hevc_amf hevc_qsv libx265"
          else
            curl -fsSL -o /tmp/ffmpeg.tar.xz "${{ matrix.ffmpeg }}"
            tar xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg
            cp /tmp/ffmpeg/*/bin/ffmpeg app/src-tauri/bin/ffmpeg
            chmod +x app/src-tauri/bin/ffmpeg
            ff=app/src-tauri/bin/ffmpeg
            want="hevc_nvenc hevc_amf hevc_qsv hevc_vaapi libx265"
          fi
          enc=$("$ff" -hide_banner -encoders)
          for e in $want; do echo "$enc" | grep -q " $e " || { echo "ffmpeg lacks $e"; exit 1; }; done

      - name: Build desktop app
        working-directory: app/src-tauri
        shell: bash
        # Updater artifacts: the macOS .app.tar.gz and a .sig next to every installer the app
        # can update itself from, signed with the updater key (see tauri.conf.json).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true,"resources":{"bin/ffmpeg":"ffmpeg"}}}'
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cargo tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true,"resources":{"bin/ffmpeg.exe":"ffmpeg.exe"}}}'
          else
            cargo tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true,"resources":{"bin/ffmpeg":"ffmpeg"}}}'
          fi

      - name: Build command line tool
        shell: bash
        run: |
          features=""
          # The untested CUDA and OpenCL (AMD) backends are included on Windows and Linux;
          # they stay off unless a matching GPU driver is present.
          if [ "${{ runner.os }}" != "macOS" ]; then features="--features cuda,opencl"; fi
          cargo build --release -p bluecompress-cli --target ${{ matrix.target }} $features

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          out="$PWD/dist"; mkdir -p "$out"
          b="target/${{ matrix.target }}/release/bundle"
          case "${{ runner.os }}" in
            macOS)
              cp "$b"/dmg/*.dmg "$out/Blue-Compressor_${v}_macOS_${{ matrix.arch }}.dmg"
              cp "$b"/macos/*.app.tar.gz "$out/Blue-Compressor_${v}_macOS_${{ matrix.arch }}.app.tar.gz"
              cp "$b"/macos/*.app.tar.gz.sig "$out/Blue-Compressor_${v}_macOS_${{ matrix.arch }}.app.tar.gz.sig"
              ;;
            Windows)
              cp "$b"/nsis/*.exe "$out/Blue-Compressor_${v}_Windows_${{ matrix.arch }}-setup.exe"
              cp "$b"/nsis/*.exe.sig "$out/Blue-Compressor_${v}_Windows_${{ matrix.arch }}-setup.exe.sig"
              cp "$b"/msi/*.msi "$out/Blue-Compressor_${v}_Windows_${{ matrix.arch }}.msi"
              cp "$b"/msi/*.msi.sig "$out/Blue-Compressor_${v}_Windows_${{ matrix.arch }}.msi.sig"
              ;;
            Linux)
              cp "$b"/appimage/*.AppImage "$out/Blue-Compressor_${v}_Linux_${{ matrix.arch }}.AppImage"
              cp "$b"/appimage/*.AppImage.sig "$out/Blue-Compressor_${v}_Linux_${{ matrix.arch }}.AppImage.sig"
              cp "$b"/deb/*.deb "$out/Blue-Compressor_${v}_Linux_${{ matrix.arch }}.deb"
              cp "$b"/rpm/*.rpm "$out/Blue-Compressor_${v}_Linux_${{ matrix.arch }}.rpm"
              ;;
          esac
          # Command line tool, library and C header.
          os="${{ runner.os }}"
          cli="bluecompress-cli_${v}_${os}_${{ matrix.arch }}"
          mkdir -p "$cli/include"
          r="target/${{ matrix.target }}/release"
          cp -R LICENSE NOTICE LICENSES README.md "$cli/"
          cp crates/core/include/bluecompress.h "$cli/include/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$r/bluecompress.exe" "$r/bluecompress.dll" "$r/bluecompress.dll.lib" "$cli/" 2>/dev/null || cp "$r/bluecompress.exe" "$cli/"
            7z a "$out/$cli.zip" "$cli" >/dev/null
          else
            cp "$r/bluecompress" "$cli/"
            cp "$r"/libbluecompress.{dylib,so,a} "$cli/" 2>/dev/null || true
            tar czf "$out/$cli.tar.gz" "$cli"
          fi
          ls -l "$out"

      # Signed build provenance for every file this job uploads, so anyone can check that a
      # download was built by this workflow from this repository:
      #   gh attestation verify <file> --repo redn3/blue-compressor
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  # latest.json for the in-app updater, from the signatures the builds uploaded. The app
  # reads it from the newest published release, so a draft changes nothing until it is
  # published.
  updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          python3 .github/scripts/updater-manifest.py "$TAG" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" sigs .github/release-notes.md latest.json
          gh release upload "$TAG" latest.json --clobber
