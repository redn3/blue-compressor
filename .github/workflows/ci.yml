name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Every language has every UI string
        run: node app/check-locales.mjs
      - run: cargo clippy --release -p bluecompress -p bluecompress-cli --all-targets
      - run: cargo test --release -p bluecompress
      - name: CUDA and OpenCL backends compile
        run: cargo build --release -p bluecompress-cli --features cuda,opencl
      - name: OpenCL clippy
        run: cargo clippy --release -p bluecompress --features opencl --all-targets
      - name: Install PoCL (OpenCL on the CPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd ocl-icd-libopencl1 clinfo && clinfo -l
      - name: OpenCL backend matches the CPU bit for bit (PoCL)
        if: runner.os == 'Linux'
        run: cargo test --release -p bluecompress --features opencl opencl -- --nocapture

  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo build --release -p blue-compressor-app
