services:
  blue-compressor:
    image: ghcr.io/redn3/blue-compressor:latest
    container_name: blue-compressor
    restart: unless-stopped
    ports:
      - "9847:9847"
    environment:
      - PORT=9847
      - BROWSE_ROOT=/
      # Compression: PRESET and WATCH_PRESET are lossless, light, medium or strong
      # (light, medium and strong are 0.75, 0.55 and 0.35 x each clip's own bits per pixel).
      # Set BPP or WATCH_BPP instead for a fixed size in bits per pixel, for example 1.8.
      # The older QUALITY and WATCH_QUALITY (1 to 4) still work.
      - PRESET=light
      - RESOLUTION=original
      - WATCH_ENABLED=true
      - WATCH_INPUT=/watch/in
      - WATCH_OUTPUT=/watch/out
      - WATCH_PRESET=light
      - WATCH_RESOLUTION=original
      - WATCH_POLL_SECONDS=5
      # Set to true (or toggle "Clear watch folder after process" in the Web UI)
      # to delete source clips from /watch/in once compression succeeds:
      - WATCH_CLEAR=false
      # true also writes a 10-bit H.265 Rec.709 proxy (up to 1920 wide) of every clip to a
      # Proxies folder next to its output; on a NAS without a GPU it encodes with libx265
      # on the CPU. PROXIES sets the Web UI toggle's default, WATCH_PROXIES the watch folder:
      - PROXIES=false
      - WATCH_PROXIES=false
      # Checks GitHub for a new version at start and every 12 hours (an anonymous request,
      # nothing else is sent) and shows a banner in the Web UI. The container never updates
      # itself. Set to false to turn the check off:
      - UPDATE_CHECK=true
    volumes:
      # Replace the left side of each mapping with existing folders on your NAS or host
      # (for example /volume1/video:/media on Synology). Create the host folders first,
      # as Synology Container Manager refuses to start if a mapped path does not exist:
      - /path/to/your/media:/media
      - /path/to/your/watch-in:/watch/in
      - /path/to/your/watch-out:/watch/out
